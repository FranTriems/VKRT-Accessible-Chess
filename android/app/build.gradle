plugins { id 'com.android.application' }
android {
  namespace 'org.vkrt.accessiblechess'
  compileSdk 34
  buildToolsVersion '35.0.0'
  ndkVersion '27.0.12077973'
  defaultConfig {
    applicationId 'org.vkrt.accessiblechess'
    minSdk 26
    targetSdk 34
    versionCode 6
    versionName '0.5.0-alpha.2-rc1'
    externalNativeBuild { cmake { cppFlags '-std=c++20 -fexceptions -frtti' } }
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
  // The ELF UCI executable is installed as a native lib; do not strip its program headers.
  packaging { jniLibs { keepDebugSymbols.add('**/libstockfish.so') } }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
